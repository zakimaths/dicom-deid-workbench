name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: Python / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.17"
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
      - run: uv run --locked python scripts/reproduce.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproduction-${{ matrix.os }}
          path: output/reproduction.json
  pixels:
    name: Browser pixel math
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: npm test

  browsers:
    name: Browser flows / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.17"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:records
      - run: npm run benchmark:records
      - run: npm run test:browser
      - run: npm run build:preview
      - run: npm run test:exercise
      - run: npm run test:accessibility
      - run: npm run benchmark:ocr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-checks-${{ matrix.os }}
          path: |
            output/browser/results.json
            output/browser/*.png
            output/accessibility/
            output/benchmarks/
            output/records-browser/
            output/records-evaluation.json

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.17"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - name: Audit locked Python dependencies
        run: |
          mkdir -p output
          uv export --locked --no-emit-project --format requirements-txt --output-file output/audit-locked.txt
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes -r output/audit-locked.txt

  dicom-validator:
    name: Independent classic CT/MR validation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.17"
      - run: uv sync --locked
      - name: Fetch pinned validator and check archive hash
        run: |
          mkdir -p tmp/validator
          curl --fail --location --retry 3 --max-time 120 https://www.dclunie.com/dicom3tools/workinprogress/macexe/dicom3tools_macexe_1.00.snapshot.20260803085716.zip -o tmp/validator/tools.zip
          echo 'c1d1feb60a1b206862c52db5a4e3115987c134467332f3397957050e4a83e5e1  tmp/validator/tools.zip' | shasum -a 256 --check
          unzip -q tmp/validator/tools.zip -d tmp/validator
      - run: uv run --locked python scripts/validate_iod.py --validator tmp/validator/dciodvfy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: independent-iod-validation
          path: output/iod-validation.json
