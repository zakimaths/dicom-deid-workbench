name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: Python / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
      - run: uv run --locked python scripts/reproduce.py
      - uses: actions/upload-artifact@v4
        with:
          name: reproduction-${{ matrix.os }}
          path: output/reproduction.json
  pixels:
    name: Browser pixel math
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/pixels.test.mjs
