[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dicom-deid-workbench"
version = "0.5.0"
description = "Local medical-image and hospital-record review tools with reproducible de-identification checks."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "nibabel==5.3.2",
    "numpy==2.2.6",
    "pillow==12.3.0",
    "pydicom==3.0.2",
    "pypdf==6.17.0",
]

[project.scripts]
dicom-workbench = "dicom_workbench.cli:main"

[dependency-groups]
dev = ["pytest==9.0.3", "numpy==2.2.6", "ruff==0.12.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tmp", "output"]

[tool.hatch.build.targets.wheel]
packages = ["src/dicom_workbench"]
