[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dicom-deid-workbench"
version = "0.2.1"
description = "A small local DICOM metadata scrubber and 2D viewer, with synthetic fixtures and reproducible tests."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = ["pydicom==3.0.2"]

[project.scripts]
dicom-workbench = "dicom_workbench.cli:main"

[dependency-groups]
dev = ["pytest==9.0.3", "numpy==2.2.6", "ruff==0.12.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tmp", "output"]

[tool.hatch.build.targets.wheel]
packages = ["src/dicom_workbench"]
